; Copy this file to sdmc:/switch/pctltcp/rental.ini
; Lines starting with ; or # are comments.
;
; NOTE: Setting "salt" here overrides the salt baked into the NRO at build
; time.  Because this file lives on the SD card, a technically-savvy renter
; who can read the SD card could also read the salt. For maximum security,
; prefer setting the salt at build time (via RENTAL_SALT env / GitHub Secret)
; and do NOT deploy this file.

; salt = CHANGE-MY-RENTAL-SALT-PLEASE-2025

; Rental period length in days (1 ~ 365).
period_days = 7

; Grace period (hours) after the paid period ends before the console is
; actually locked. 0 = lock immediately.
grace_hours = 12
