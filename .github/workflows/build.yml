name: Build NRO

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Switch NRO
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      LIBNX: /opt/devkitpro/libnx
      PATH: /opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    defaults:
      run:
        working-directory: switch-src

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        working-directory: /
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update || true
          apt-get install -y --no-install-recommends zip

          echo "=== Locating dkp-pacman ==="
          which dkp-pacman || find / -iname "*dkp-pacman*" 2>/dev/null || true

          if command -v dkp-pacman >/dev/null 2>&1; then
            dkp-pacman --noconfirm -Syu || true
            dkp-pacman --noconfirm -S switch-dev || true
          else
            echo "⚠️ dkp-pacman not found, assuming switch-dev is pre-installed in base image."
          fi

          # ✅ 只做"软"验证，不因缺少某个文件而中断构建
          echo "=== Verifying installation (non-blocking) ==="
          if [ -f /opt/devkitpro/libnx/include/switch.h ]; then
            echo "✅ switch.h found"
          else
            echo "❌ switch.h NOT found"
          fi

          echo "--- Searching for libnx pkgconfig files ---"
          find /opt/devkitpro -iname "*.pc" 2>/dev/null | grep -i nx || echo "No libnx .pc file found (this may be normal)"

          echo "--- devkitpro libnx directory listing ---"
          ls -la /opt/devkitpro/libnx/lib/ 2>/dev/null || true
          ls -la /opt/devkitpro/libnx/lib/pkgconfig/ 2>/dev/null || true

          echo "DEVKITPRO=$DEVKITPRO"
          aarch64-none-elf-gcc --version
          elf2nro --version || true

      - name: Build NRO
        run: |
          set -e
          # ✅ 即使 pkgconfig 文件不存在，也不影响大多数基于 libnx Makefile 模板的项目
          export PKG_CONFIG_PATH=$DEVKITPRO/libnx/lib/pkgconfig:$DEVKITPRO/portlibs/switch/lib/pkgconfig

          if [ -n "${{ secrets.RENTAL_SALT }}" ]; then
            export SALT_ARG="RENTAL_SALT=${{ secrets.RENTAL_SALT }}"
          else
            export SALT_ARG=""
          fi
          if [ -n "${{ vars.RENTAL_PERIOD_DAYS }}" ]; then
            export PERIOD_ARG="RENTAL_PERIOD_DAYS=${{ vars.RENTAL_PERIOD_DAYS }}"
          else
            export PERIOD_ARG=""
          fi
          mkdir -p out
          make -j$(nproc) $SALT_ARG $PERIOD_ARG

      - name: Prepare artifact
        id: artifact
        run: |
          set -e
          mkdir -p dist
          cp out/pctltcp-allinone.nro dist/
          cp -n ../README.md dist/README.md 2>/dev/null || true
          ls -la dist/
          echo "nro_path=dist/pctltcp-allinone.nro" >> $GITHUB_OUTPUT
          echo "zip_path=pctltcp-allinone.zip" >> $GITHUB_OUTPUT
          (cd dist && zip -r ../pctltcp-allinone.zip .)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pctltcp-allinone
          path: switch-src/dist/

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            switch-src/dist/pctltcp-allinone.nro
            switch-src/pctltcp-allinone.zip
          generate_release_notes: true
          body: |
            ## PCTL All-in-One Rental Edition

            Assets below:
            - `pctltcp-allinone.nro` — copy to `sdmc:/switch/pctltcp-allinone.nro` on your Switch's SD card.
            - `pctltcp-allinone.zip` — same NRO bundled with release notes.

            ### Installation
            1. Download `pctltcp-allinone.nro`
            2. Copy to `/switch/pctltcp-allinone.nro` on the SD card
            3. Launch from the Homebrew Menu
            4. On first run the machine code is shown on screen; the renter sends it to you and you generate the 8-digit unlock key via the web key generator.

            ### Key generator web page
            The static site deployed from this repo's `src/` (Next.js) can be used to generate keys. The same algorithm runs offline on the Switch.
